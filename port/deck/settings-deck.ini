# LEGO Dimensions port settings (also in the game's Options menu) - Steam Deck defaults
scale=0  # automatic: the Deck screen's resolution
aspect=0
display=1  # 0 windowed, 1 borderless, 2 fullscreen
aa=1  # 0 off, 1 FXAA, 2 TAA
vsync=1  # 0 fast (mailbox), 1 on, 2 off
ultrawide=0  # 0 off, 1 21:9, 2 32:9 (after a restart)
